apiVersion: apps/v1
kind: Deployment

metadata:
  name: dummypro-deployment
  namespace: dummy
  labels:
    app: dummypro

spec:
  replicas: 2

  selector:
    matchLabels:
      app: dummypro

  template:
    metadata:
      labels:
        app: dummypro

    spec:
      containers:
        - name: dummypro
          image: mepointdexter/balls:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5000